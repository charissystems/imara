openapi: 3.0.0
info:
  title: SACCO Management System API
  description: |
    Comprehensive REST API for SACCO (Savings and Credit Cooperative Organization) management.
    
    - Full member lifecycle management
    - Loan application, appraisal, and disbursement
    - Savings accounts and transactions
    - Fixed deposits and shares management
    - Financial reporting and audit trails
    - Multi-tenant architecture
    
    **Authentication**: Bearer tokens for staff endpoints, tenant identification via headers
    **Base URL**: `https://api.sacco.local/api` (production), `http://localhost:3000/api` (development)
  version: 1.0.0
  contact:
    name: API Support
    email: support@sacco.local
  license:
    name: Proprietary
    url: https://sacco.local/license

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://staging-api.sacco.local/api
    description: Staging server
  - url: https://api.sacco.local/api
    description: Production server

security:
  - BearerAuth: []
  - TenantAuth: []

paths:
  /auth/login:
    post:
      summary: Staff Login
      tags:
        - Authentication
      description: Authenticate staff and obtain access/refresh tokens
      security:
        - TenantAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: staff@sacco.local
                password:
                  type: string
                  format: password
                  example: Password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      staff:
                        type: object
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Account locked or other validation error

  /members:
    get:
      summary: List Members
      tags:
        - Members
      description: Retrieve list of members with optional filtering and pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Records per page
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
              - suspended
              - closed
          description: Filter by member status
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or member number
      responses:
        '200':
          description: Members list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                      total:
                        type: integer
                      page:
                        type: integer
                      pages:
                        type: integer

    post:
      summary: Create Member
      tags:
        - Members
      description: Register a new SACCO member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Duplicate member number

  /members/{memberId}:
    get:
      summary: Get Member Details
      tags:
        - Members
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update Member
      tags:
        - Members
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Delete Member
      tags:
        - Members
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /loans:
    get:
      summary: List Loans
      tags:
        - Loans
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - approved
              - active
              - closed
              - defaulted
        - in: query
          name: member_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Loans list

  /loans/applications:
    post:
      summary: Create Loan Application
      tags:
        - Loans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - member_id
                - loan_product_id
                - amount
                - duration_months
              properties:
                member_id:
                  type: string
                loan_product_id:
                  type: string
                amount:
                  type: number
                  minimum: 0
                duration_months:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Application created

  /accounts:
    get:
      summary: List Accounts
      tags:
        - Accounts
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: member_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Accounts list

  /reports:
    get:
      summary: Generate Reports
      tags:
        - Reports
      description: Generate various financial and operational reports
      parameters:
        - in: query
          name: report_type
          schema:
            type: string
            enum:
              - member_summary
              - loan_portfolio
              - savings_summary
              - daily_transactions
              - audit_log
          required: true
        - in: query
          name: date_from
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Report generated

  /audit-logs:
    get:
      summary: View Audit Logs
      tags:
        - Audit
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Audit logs

components:
  schemas:
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_number:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
            - closed
        joined_date:
          type: string
          format: date-time

    CreateMemberRequest:
      type: object
      required:
        - first_name
        - last_name
        - member_number
      properties:
        first_name:
          type: string
          minLength: 2
        middle_name:
          type: string
        last_name:
          type: string
          minLength: 2
        member_number:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        phone:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - male
            - female
            - other
            - unknown
        nationality:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
            - closed
          default: active
        joined_date:
          type: string
          format: date-time

    UpdateMemberRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
            - closed

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer
            details:
              type: object

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: No authorization token provided

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  details:
                    type: object

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for staff endpoints

    TenantAuth:
      type: apiKey
      in: header
      name: X-Tenant-Subdomain
      description: Tenant identifier header (required for all requests)

tags:
  - name: Authentication
    description: Staff login and session management
  - name: Members
    description: Member registration and profile management
  - name: Accounts
    description: Savings and investment accounts
  - name: Loans
    description: Loan products, applications, and management
  - name: Shares
    description: Share purchases and management
  - name: Fixed Deposits
    description: Fixed deposit accounts and maturity
  - name: Accounting
    description: Financial accounting and ledgers
  - name: Reports
    description: Financial and operational reports
  - name: Audit
    description: Audit trails and compliance logs
  - name: Admin
    description: Administrative operations

externalDocs:
  description: Complete API documentation
  url: https://docs.sacco.local/api
