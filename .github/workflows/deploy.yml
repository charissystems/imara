name: Deploy

on:
  push:
    branches: [main, development]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false  # Never cancel in-flight deploys

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ── Gate: full CI must pass first ─────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Build & Push Docker Image ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/development'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        run: |
          echo "Running migrations against staging database..."
          # TODO: Replace with actual migration command, e.g.:
          # ssh $STAGING_HOST "cd /app && node dist/scripts/migrate-all-tenants.js"
          echo "Migrations complete."

      - name: Deploy to staging
        run: |
          echo "Deploying image ${{ needs.build-and-push.outputs.image-tag }} to staging..."
          # TODO: Replace with your deployment mechanism:
          # Option A: docker compose pull && docker compose up -d
          # Option B: kubectl set image deployment/imara-backend ...
          # Option C: Cloud provider CLI (fly deploy, railway up, etc.)
          echo "Staging deployment complete."

  # ── Deploy to Production ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
      # GitHub Environment protection rules enforce:
      # - Required reviewers (manual approval gate)
      # - Wait timer (optional cool-down)

    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        run: |
          echo "Running migrations against production database..."
          # TODO: Replace with actual migration command
          echo "Migrations complete."

      - name: Deploy to production
        run: |
          echo "Deploying image ${{ needs.build-and-push.outputs.image-tag }} to production..."
          # TODO: Replace with your deployment mechanism
          echo "Production deployment complete."

      - name: Smoke test
        run: |
          echo "Running smoke tests against production..."
          # TODO: curl -f $PRODUCTION_URL/health || exit 1
          echo "Smoke tests passed."

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Production deployment failed!"
          # TODO: Send Slack/email notification
