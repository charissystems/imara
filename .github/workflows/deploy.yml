name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false  # Never cancel in-flight deploys

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ── Gate: full CI must pass first ─────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Build & Push Docker Image ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ── Deploy to Staging ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        run: |
          echo "Running migrations against staging database..."
          # TODO: Replace with actual migration command, e.g.:
          # ssh $STAGING_HOST "cd /app && node dist/scripts/migrate-all-tenants.js"
          echo "Migrations complete."

      - name: Deploy to staging
        run: |
          echo "Deploying image ${{ needs.build-and-push.outputs.image-tag }} to staging..."
          # TODO: Replace with your deployment mechanism:
          # Option A: docker compose pull && docker compose up -d
          # Option B: kubectl set image deployment/imara-backend ...
          # Option C: Cloud provider CLI (fly deploy, railway up, etc.)
          echo "Staging deployment complete."

      - name: Health check
        run: |
          echo "Verifying staging health..."
          # TODO: Uncomment when staging URL is configured
          # for i in $(seq 1 10); do
          #   STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/health" || true)
          #   if [ "$STATUS" = "200" ]; then
          #     echo "Health check passed"
          #     exit 0
          #   fi
          #   echo "Attempt $i: status=$STATUS, retrying in 10s..."
          #   sleep 10
          # done
          # echo "Health check failed after 10 attempts"
          # exit 1
          echo "Health check skipped (placeholder)."

  # ── Deploy to Production ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
      # GitHub Environment protection rules enforce:
      # - Required reviewers (manual approval gate)
      # - Wait timer (optional cool-down)

    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        run: |
          echo "Running migrations against production database..."
          # TODO: Replace with actual migration command
          echo "Migrations complete."

      - name: Deploy to production
        run: |
          echo "Deploying image ${{ needs.build-and-push.outputs.image-tag }} to production..."
          # TODO: Replace with your deployment mechanism
          echo "Production deployment complete."

      - name: Health check
        run: |
          echo "Verifying production health..."
          # TODO: Uncomment when production URL is configured
          # for i in $(seq 1 10); do
          #   STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/health" || true)
          #   if [ "$STATUS" = "200" ]; then
          #     echo "Health check passed"
          #     exit 0
          #   fi
          #   echo "Attempt $i: status=$STATUS, retrying in 10s..."
          #   sleep 10
          # done
          # echo "Health check failed after 10 attempts"
          # exit 1
          echo "Health check skipped (placeholder)."

      - name: Deployment summary
        run: |
          echo "### Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ needs.build-and-push.outputs.image-digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deployment failed!"
          # TODO: Send Slack/email notification
