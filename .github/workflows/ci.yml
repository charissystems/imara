name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
  pull_request:
    branches: [main, development]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Typecheck ─────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Typecheck
        run: pnpm tsc --noEmit
        working-directory: backend

  # ── Security Audit ────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        working-directory: backend

  # ── Unit Tests & Coverage ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: [typecheck, security-audit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Run unit tests with coverage
        run: pnpm test:unit:coverage
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          if [ -f coverage/coverage-final.json ]; then
            echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Thresholds: 70% lines/functions, 60% branches, 70% statements" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full report uploaded as **coverage-report** artifact." >> $GITHUB_STEP_SUMMARY
          fi

  # ── Integration Tests ─────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck, security-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imara_test
          POSTGRES_PASSWORD: imara_test
          POSTGRES_DB: imara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U imara_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Run integration tests
        run: pnpm test:integration
        working-directory: backend
        env:
          DATABASE_URL: postgres://imara_test:imara_test@localhost:5432/imara_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ── Docker Build (validate only — no push) ────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: imara-backend:pr-${{ github.event.pull_request.number }}
