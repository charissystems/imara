name: Security Scan

on:
  # Only trigger on schedule and manually — push/PR security checks
  # are handled by ci.yml (typecheck, audit, tests).
  schedule:
    # Run weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # ── Dependency Audit (production + dev) ───────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend

      - name: Audit production dependencies
        run: pnpm audit --audit-level=moderate --production
        working-directory: backend

      - name: Full audit report
        if: always()
        working-directory: backend
        run: |
          echo "### Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pnpm audit --audit-level=high --json 2>/dev/null | head -200 >> $GITHUB_STEP_SUMMARY || true

  # ── Code Security Checks ─────────────────────────────────────────────
  security-best-practices:
    name: Security Best Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for potential secrets..."
          if grep -r -E "(password|secret|api_key|token|credential)\s*=\s*['\"][^'\"]+['\"]" \
            backend/src/ --exclude-dir=node_modules --exclude="*.md" 2>/dev/null; then
            echo "::error::Potential hardcoded secrets detected. Please review."
            exit 1
          fi
          echo "No obvious hardcoded secrets found."

      - name: Check .env is in .gitignore
        run: |
          if ! grep -q "^\.env$" .gitignore; then
            echo "::error::.env file is not in .gitignore!"
            exit 1
          fi

      - name: Verify JWT secret length requirements
        run: |
          if ! grep -q "JWT_SECRET.*length.*32" backend/src/config/index.ts; then
            echo "::warning::JWT secret length validation may be missing in config"
          fi

  # ── Summary ───────────────────────────────────────────────────────────
  report:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, security-best-practices]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Weekly Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checks performed:" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency vulnerability scan (production + dev)" >> $GITHUB_STEP_SUMMARY
          echo "- Hardcoded secrets detection" >> $GITHUB_STEP_SUMMARY
          echo "- .gitignore / config validation" >> $GITHUB_STEP_SUMMARY
